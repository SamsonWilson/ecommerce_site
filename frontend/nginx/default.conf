# nginx edge : point d'entrée unique du site.
#  - sert la SPA React (URLs propres, sans #)
#  - reverse proxy : le navigateur ne voit jamais l'URL du backend
#  - load balancer : répartit /api entre les réplicas "backend" et écarte
#    automatiquement ceux qui ne répondent pas (vérification des existants)

# Résolveur DNS interne de Docker : permet de redécouvrir les réplicas
# du service "backend" à chaud (scaling) et de les équilibrer en round-robin.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- SPA : toute route inconnue retombe sur index.html ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets hashés par Vite : cache long
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- Backend proxifié + équilibré ---
    location ~ ^/(api|admin|static|health)/ {
        set $backend backend:8000;                 # variable => résolution DNS à chaud
        proxy_pass http://$backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Vérification des backends : si un réplica échoue/timeout,
        # nginx rebascule la requête sur un autre réplica sain.
        proxy_connect_timeout 3s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }

    # Santé de l'edge lui-même
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
